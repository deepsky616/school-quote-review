<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>견적정리 도우미</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span>견</span><div><strong>견적정리</strong><small>브라우저 도우미</small></div></header>
      <section>
        <p class="eyebrow">현재 주문내역 화면</p>
        <h1>필요한 항목만<br />안전하게 가져와요.</h1>
        <p class="copy">로그인 정보나 쿠키는 읽지 않습니다. 품명·수량·금액과 원본 주소만 브라우저 안에 임시 저장합니다.</p>
        <button id="capture" type="button">이 페이지의 주문 가져오기 <span>→</span></button>
        <p id="status" class="status" aria-live="polite">주문내역 페이지에서 실행해 주세요.</p>
      </section>
      <footer>V-P01 · V-P02 오류 시 자동으로 중단합니다.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
