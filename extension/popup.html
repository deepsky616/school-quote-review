<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>에듀파인 품의내역 도우미</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span>📋</span><div><strong>에듀파인 품의내역</strong><small>브라우저 도우미</small></div></header>
      <section>
        <p class="eyebrow">현재 주문내역 화면</p>
        <h1>필요한 항목만<br />안전하게 가져와요.</h1>
        <p class="copy">구조화된 상품 데이터를 먼저 확인하고, 없으면 화면 구조를 읽습니다. 로그인 정보나 쿠키는 저장하지 않습니다.</p>
        <button id="capture" type="button">이 페이지의 주문 가져오기 <span>→</span></button>
        <p id="status" class="status" aria-live="polite">주문내역 페이지에서 실행해 주세요.</p>
      </section>
      <footer>L2 구조화 데이터 → L3 화면 구조 · V-P01/V-P02 오류 시 중단</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
